name: Bug report
description: Something in Smorza does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Smorza and macOS versions
      placeholder: Smorza 0.3.0, macOS 15.5
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Open Settings (the gear in the panel), right-click the version under Updates, choose Copy Diagnostics and
        paste the result here. It lists the versions, your Mac's model, the output devices, the apps you changed or
        that were playing, and the mixer's recent log.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: The output device you use, other audio apps running (SoundSource, Background Music, Loopback), screenshots.
